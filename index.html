<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<title>Dossiê de Posicionamento</title>
<style>
:root{
  --ink:#0A0A0A; --paper:#FFFFFF; --ink-2:#3D3D3D; --ink-3:#767676;
  --line:#E2E2E2; --wash:#F7F7F5;
  --serif:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,Helvetica,Arial,sans-serif;
  --mono:"SF Mono","JetBrains Mono","IBM Plex Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:#FFF;font-family:var(--sans);
     line-height:1.7;display:flex;align-items:center;justify-content:center;padding:28px}
.box{width:100%;max-width:410px}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
         opacity:.5;margin:0 0 18px}
h1{font-family:var(--serif);font-size:34px;line-height:1.12;margin:0 0 10px;font-weight:400;
   letter-spacing:-.015em}
.sub{font-size:14px;opacity:.6;margin:0 0 36px}
.rule{height:1px;background:#FFF;opacity:.14;margin:0 0 28px}
label{display:block;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
      opacity:.55;margin:0 0 10px}
input{width:100%;padding:14px 16px;background:transparent;color:#FFF;font-family:var(--mono);
      border:1px solid rgba(255,255,255,.22);border-radius:2px;font-size:15px;
      letter-spacing:.06em;outline:none;transition:border-color .15s}
input:focus{border-color:rgba(255,255,255,.65)}
button{width:100%;margin-top:14px;padding:14px;background:#FFF;color:var(--ink);border:0;
       border-radius:2px;font-family:var(--sans);font-size:13px;font-weight:600;
       letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:opacity .15s}
button:hover{opacity:.85}
button:disabled{opacity:.4;cursor:default}
.erro{margin-top:16px;font-size:13px;color:#FFF;opacity:0;transition:opacity .2s}
.erro.on{opacity:.8}
.pe{margin-top:44px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.32}
</style>
</head>
<body>
<div class="box">
  <p class="eyebrow">Documento confidencial</p>
  <h1>Dossiê de Posicionamento</h1>
  <p class="sub">Felipe Gobbi · preparado para Doug de Marco</p>
  <div class="rule"></div>
  <form id="f">
    <label for="s">Senha de acesso</label>
    <input id="s" type="password" autocomplete="off" autofocus spellcheck="false">
    <button type="submit" id="b">Abrir documento</button>
  </form>
  <p class="erro" id="e">Senha incorreta.</p>
  <p class="pe">Felipe Gobbi · uso interno</p>
</div>

const b2a=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function abrir(senha){
  const ec=new TextEncoder();
  const base=await crypto.subtle.importKey("raw",ec.encode(senha),"PBKDF2",false,["deriveKey"]);
  const chave=await crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:b2a(SALT),iterations:ITER,hash:"SHA-256"},
    base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const claro=await crypto.subtle.decrypt({name:"AES-GCM",iv:b2a(IV)},chave,b2a(DADOS));
  return new TextDecoder().decode(claro);
}
const f=document.getElementById("f"), b=document.getElementById("b"), e=document.getElementById("e");
f.addEventListener("submit",async ev=>{
  ev.preventDefault(); e.classList.remove("on");
  b.disabled=true; b.textContent="Abrindo…";
  try{
    const html=await abrir(document.getElementById("s").value);
    document.open(); document.write(html); document.close();
  }catch(_){
    e.classList.add("on"); b.disabled=false; b.textContent="Abrir documento";
    document.getElementById("s").value=""; document.getElementById("s").focus();
  }
});
